[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "power-grid-env"
version = "0.1.0"
description = "Платформа инженерной проверки алгоритмов управления распределительными сетями"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "power-grid-env contributors" }]
dependencies = [
  "numpy>=1.26",
  "scipy>=1.11",
  "pydantic>=2.6",
  "opendssdirect.py>=0.9.4",
  "pyarrow>=14",
  "gymnasium>=0.29",
  "pyyaml>=6",
  "jsonschema>=4.18",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
power-grid = "power_grid_env.cli:main"

[tool.setuptools.packages.find]
include = ["power_grid_env*"]

[tool.setuptools.package-data]
power_grid_env = ["py.typed", "assets/sld/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]
