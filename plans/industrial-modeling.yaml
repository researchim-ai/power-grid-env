    вычислены из evidence
- id: PM-10
  title: Связь уровней физики
  status: done
  progress: >-
    Одно КЗ связывает фазную сеть, ток защиты и срыв момента на одном
    напряжении. SMIB стартует из напряжения режима без шага времени.
    Огибающая тока того же класса RL сверена с формулой и с неявной трапецией,
    ошибка шага падает примерно вчетверо. Тепловой ток — корень из среднего
    квадрата этой огибающей, не коэффициент m стандарта. Натурный трек
    по-прежнему waiting_for_data. Напряжение фазной сети стартует SMIB без шага
    времени. Действующий ток огибающей и ток фазной сети совпадают с |E|/|Z|.
    Скачок напряжения RL не рвёт ток, трапеция сходится к формуле.
    Включение одной RL-цепи связывает фазный ток сети, установившееся
    действующее значение и мгновенный ток: расхождение нулевого включения
    равно затухающей постоянной, периодический старт сходится к формуле,
    ошибка шага падает вчетверо. Удержание границы грубее прямой между
    отсчётами, отказ шага возвращает прежний ток, баланс энергии держится.
    Натурный трек waiting_for_data. Полный EMT сети и HELICS вне этой поставки.
  depends_on:
  - PM-03
  - PM-06
  gate: State/base/time/energy handoff; отдельный field-data track
  evidence_required:
  - versioned_case_and_parameters
  - replay_command
  - reference_and_scope
  - metrics_and_failures
  definition_of_done: Пройдены gates соответствующего раздела документа; результаты
    вычислены из evidence
- id: PM-11
  title: Масштаб и сравнение
  status: done
  progress: >-
    qualify записывает измеренный p50 двухшинного решения. Напряжение и угол
    той же двухшинной схемы совпадают с ANDES внутри 1e-5 о.е. и 1e-4 рад.
    Колесо ставится в пустой каталог и импортируется на этой машине.
    Превосходство не доказано, выпуск не открыт, 10 000 шин не объявлены
    городом. PyDSS, Power Grid Model и Grid2Op не сравнивались. Установка
    на другой машине не проверялась.
  depends_on:
