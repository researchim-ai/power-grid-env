schema: power-grid-env.modeling-roadmap/v1
date: '2026-10-27'
baseline:
  commit: 93eb7e6
  working_tree_contains_changes: true
  assessment: reports/modeling-next-stage-93eb7e6/assessment.json
document: docs/INDUSTRIAL_MODELING_STAGES_RU.md
status: planned
supersedes: Последовательность дальнейшего физического моделирования; AG-статусы сохраняются
competitive_superiority_demonstrated: false
agent_rules:
- Не изменять существующие dirty правки без проверки
- Equation/model note → schema → adapter → independent oracle → negative cases → qualification
- Same-engine сравнение не является независимой верификацией физики
- Не понижать допуски после просмотра результата
- Missing field data блокируют field claim, а не независимую synthetic qualification
phases:
- id: PM-00
  title: Численная квалификация
  status: done
  progress: >-
    Якобиан неявной трапеции равен I - h/2·df/dx. Несошедшийся шаг вызывает
    ошибку. Порядок шага около 2. Разрывы напряжения стоят на узлах сетки.
    Direct, process, инкрементальная правка нагрузки и checkpoint дают одно
    напряжение внутри 1e-5 о.е. Луч за носом кривой остаётся несходимостью, не пределом числа узлов.
  depends_on: []
  gate: Якобиан residual, отказ по несходимости, сходимость по шагу, runtime parity
  evidence_required:
  - versioned_case_and_parameters
  - replay_command
  - reference_and_scope
  - metrics_and_failures
  definition_of_done: Пройдены gates соответствующего раздела документа; результаты
    вычислены из evidence
- id: PM-01
  title: Контракты оборудования
  status: done
  progress: >-
    compile_scope не подставляет спектр, инерцию машины и r0/x0 источника.
    Топологический аппарат явно без импеданса. Roundtrip сохраняет матрицы линии
    и качество provenance. R(T) в стационарный режим не подмешивается.
  depends_on:
  - PM-00
  gate: Единицы, bases, conductor mapping, provenance и явный unsupported scope
  evidence_required:
  - versioned_case_and_parameters
  - replay_command
  - reference_and_scope
  - metrics_and_failures
  definition_of_done: Пройдены gates соответствующего раздела документа; результаты
    вычислены из evidence
- id: PM-02
  title: Стационарная фазная сеть
  status: done
  progress: >-
    Независимая MNA несимметричной четырёхпроводной схемы с импедансом
    нейтрали совпадает с фазным расчётом по V, углу, току, P/Q, потерям,
    фаза-нейтраль, линейным напряжениям и симметричным составляющим.
    Петля из двух источников совпадает с отдельной MNA; один источник принимает
    мощность. ZIP совпадает со своим Ньютоном и отличается от чистой постоянной
    мощности. На пределе Q машина PV совпадает с Ньютоном при Q=Qmax и не
    держит уставку. Плавающая звезда на нейтрали четырёхпроводной линии
    совпадает с MNA, нейтраль приёмника не заземлена. Dyn11 с отпайкой 1.025
    и сопротивлением КЗ совпадает с прямой последовательностью, НН опережает ВН.
    РПН делает одну ступень после выдержки, внутри зоны молчит и упирается в предел.
    YNyn0yn0 с явными %R обмоток совпадает со звездой, приведённой к базе ВН.
  depends_on:
  - PM-01
  gate: Независимые V/I/P/Q/losses, нейтраль, группы трансформаторов, KCL
  evidence_required:
  - versioned_case_and_parameters
  - replay_command
  - reference_and_scope
  - metrics_and_failures
  definition_of_done: Пройдены gates соответствующего раздела документа; результаты
    вычислены из evidence
- id: PM-03
  title: QSTS и тепловое состояние
  status: done
  progress: >-
    Два интервала профиля по 30 с сохраняют баланс источника, нагрузки и потерь.
    Конденсатор в Engine делает одну ступень после выдержки, снимок её сохраняет.
    Тепло сходится к формуле, ошибка Эйлера падает вдвое при шаге вдвое. R(T)
    в стационарный режим не входит. 7 и 30 суток Engine на двухшинной схеме
    с шагом 1 сутки: след ограничен, интеграл энергии сохраняется, середина
    7 суток воспроизводится. Это не городской фидер и не 15-минутный профиль.
  depends_on:
  - PM-02
  gate: Энергобаланс, event replay, thermal oracle, production Engine 7/30 суток
  evidence_required:
  - versioned_case_and_parameters
  - replay_command
  - reference_and_scope
  - metrics_and_failures
  definition_of_done: Пройдены gates соответствующего раздела документа; результаты
    вычислены из evidence
- id: PM-04
  title: Короткие замыкания
  status: in_progress
  progress: >-
    SLG, LL и LLG на шине источника с явными Z1 и Z0 совпадают с расчётом
    повреждённой сети внутри 1e-5 по току и 1e-4 рад. LLG — это два реактора
    фаза–земля и фазная матрица, не параллель Z2 с (Z0+3 Zf) и не IEC 60909.
    Отдельно IEC 60909-0 для одного источника: c по таблице, I''k 3ф и 1ф,
    пиковый коэффициент κ. При c=1.1 ток не равен режиму повреждённой сети.
    Два источника в сетке дают раздельные вклады в трёхфазное КЗ, это режим
    повреждённой сети. Ib = μ I''k только для ближней синхронной машины,
    вдали μ = 1. Междуфазный I''k2 при Z1=Z2 равен √3/2 трёхфазного.
    Двигателя как динамической модели и сетки стандарта нет.
  depends_on:
  - PM-02
  gate: Раздельные faulted operating point и standard-method SC, независимый oracle
  evidence_required:
  - versioned_case_and_parameters
  - replay_command
  - reference_and_scope
  - metrics_and_failures
  definition_of_done: Пройдены gates соответствующего раздела документа; результаты
    вычислены из evidence
- id: PM-05
  title: Защиты и АВР
  status: in_progress
  progress: >-
    Ниже уставки реле молчит. Ближняя определённая выдержка 0.2 с срабатывает
    раньше дальней 0.5 с. При отказе ближнего дальнее срабатывает в своё время.
    Обратная мощность не пускает направленное реле. Карта по току ставит
    ближнее реле раньше дальнего. Реле смотрит вторичную величину CT, без
    измерения не отключает. Земля — сумма трёх токов. Критическая шина
    остаётся, если отключён нижестоящий аппарат. Дистанционной и
    дифференциальной защиты нет.
  depends_on:
  - PM-03
  - PM-04
  gate: Селективность, CT/VT, времена отключений, отрицательные сценарии
  evidence_required:
  - versioned_case_and_parameters
  - replay_command
  - reference_and_scope
  - metrics_and_failures
  definition_of_done: Пройдены gates соответствующего раздела документа; результаты
    вычислены из evidence
- id: PM-06
  title: Многомашинная RMS динамика
  status: in_progress
  progress: >-
    Две классические машины без возмущения остаются в равновесии. Ошибка угла
    падает примерно вчетверо при шаге вдвое. SMIB стартует из напряжения режима.
    ANDES не подключён, industrial_rms_qualified ложен. AVR, PSS и остров машин не закрыты.
  depends_on:
  - PM-00
  - PM-01
  - PM-02
  gate: DAE initialization, generators/controllers, reference trajectories
  evidence_required:
  - versioned_case_and_parameters
  - replay_command
  - reference_and_scope
  - metrics_and_failures
  definition_of_done: Пройдены gates соответствующего раздела документа; результаты
    вычислены из evidence
- id: PM-07
  title: Двигатели и преобразователи
  status: in_progress
  progress: >-
    Одноконтурный двигатель за сопротивлением сети сходится к моменту
    нагрузки на устойчивой ветви и опрокидывается выше неё. Te = Pзазора/ω.
    Пуск идёт по приоритету и останавливается, если напряжение ниже порога.
    Остров только с grid-following инвертором не получает искусственный slack.
    Grid-forming — источник за явным R и X: напряжение совпадает с Тевенином,
    при превышении Sном предел не подменяется. Группа двигателей пускается
    по приоритету, пока напряжение фидера не падает ниже порога. Импеданс
    R/s+jX одного и двух двигателей совпадает с фазным расчётом внутри 1e-5 о.е.
    Вытеснение тока, VFD и динамический самозапуск не закрыты.
  depends_on:
  - PM-06
  gate: Network-coupled start/stall/restart, current limits, island transitions
  evidence_required:
  - versioned_case_and_parameters
  - replay_command
  - reference_and_scope
  - metrics_and_failures
  definition_of_done: Пройдены gates соответствующего раздела документа; результаты
    вычислены из evidence
- id: PM-08
  title: Гармоники и качество
  status: done
  progress: >-
    Пустой спектр блокирует harmonic. Объявленный порядок снимает блокировку
    и не считается измерением. Формула RLC и отдельная узловая матрица совпадают.
    Удвоение ёмкости снижает резонанс в sqrt(2). Тройная гармоника даёт утроенный
    ток нейтрали. Типовой спектр завода и flicker не заявляются.
  depends_on:
  - PM-02
  gate: Спектры, резонансы, neutral currents и независимые frequency cases
  evidence_required:
  - versioned_case_and_parameters
  - replay_command
  - reference_and_scope
  - metrics_and_failures
  definition_of_done: Пройдены gates соответствующего раздела документа; результаты
    вычислены из evidence
- id: PM-09
  title: Оценка состояния и анализ
  status: in_progress
  progress: >-
    Ненаблюдаемая WLS возвращает estimate None. Грубая ошибка — наибольший
    нормированный остаток выше 3, одно удаление возвращает оценку к истинному
    состоянию. Локальный OPF двух узлов перепроверяется
    фазной сетью: ток линии сравнивается с длительно допустимым. Глобальный
    оптимум не заявлен. Полный корпус плохих данных не закрыт.
  depends_on:
  - PM-02
  - PM-03
  gate: Наблюдаемость, bad data, N-1 и независимая feasibility OPF
  evidence_required:
  - versioned_case_and_parameters
  - replay_command
  - reference_and_scope
  - metrics_and_failures
  definition_of_done: Пройдены gates соответствующего раздела документа; результаты
    вычислены из evidence
- id: PM-10
  title: Связь уровней физики
  status: in_progress
  progress: >-
    SMIB стартует из напряжения режима: невязка равновесия ниже 1e-9 и шаг
    времени не делается. Натурный трек по-прежнему waiting_for_data.
    Перехода PF в многомашинный RMS и в EMT нет.
  depends_on:
  - PM-03
  - PM-06
  gate: State/base/time/energy handoff; отдельный field-data track
  evidence_required:
  - versioned_case_and_parameters
  - replay_command
  - reference_and_scope
  - metrics_and_failures
  definition_of_done: Пройдены gates соответствующего раздела документа; результаты
    вычислены из evidence
- id: PM-11
  title: Масштаб и сравнение
  status: planned
  depends_on:
  - PM-02
  - PM-03
  gate: Accuracy first, realistic scale, raw repeated performance, executable qualification
  evidence_required:
  - versioned_case_and_parameters
  - replay_command
  - reference_and_scope
  - metrics_and_failures
  definition_of_done: Пройдены gates соответствующего раздела документа; результаты
    вычислены из evidence
