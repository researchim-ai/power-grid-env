    вычислены из evidence
- id: PM-05
  title: Защиты и АВР
  status: done
  progress: >-
    Ниже уставки реле молчит. Ближняя определённая выдержка 0.2 с срабатывает
    раньше дальней 0.5 с. При отказе ближнего дальнее срабатывает в своё время.
    Обратная мощность не пускает направленное реле. Карта по току ставит
    ближнее реле раньше дальнего. Реле смотрит вторичную величину CT, без
    измерения не отключает. Земля — сумма трёх токов. Критическая шина
    остаётся, если отключён нижестоящий аппарат. Ток того же КЗ с двигателем
    отключает ближнее реле раньше дальнего, а пропавшее измерение CT не даёт
    ложного отключения. Дифференциал YNyn0 сравнивает токи обмоток с
    торможением: сквозной ток не отключает, КЗ между двумя трансформаторами
    зоны отключает. Это фазорное сравнение, фильтр переходного режима не
    заявлен. АПВ включает выключатель один раз и после второго отключения
    блокируется. Плавкая вставка сравнивается с интегралом i²t огибающей КЗ.
    Включение с синхронизмом пускает на погашенную сторону и запрещает живой
    угол больше предела. Дистанционный луч |Z=V/I| видит Zлинии+Zкз внутри 1e-4.
    Короткий луч и отказ измерения не отключают. Фильтр переходного режима не заявлен.
    На луче из трёх шин ток КЗ в конце, в середине, со шунтом нагрузки и при
    слабом источнике совпадает с формулой внутри 1e-5. Ближняя уставка IEC
    раньше дальней, слабый источник молчит, переставленные TMS меняют порядок.
    АВР включает резерв на погашенный ввод. Оба режима совпадают с делителем
    внутри 1e-5 о.е. Живой угол больше предела резерв размыкает. Карта площадки
    целиком не собрана. Направленная земля на линии совпадает с формулой
    внутри 1e-5: обратный ток, малый остаток и отказ измерения молчат.
    Две ступени частотной разгрузки снимают неприоритет, критическая нагрузка
    и её мощность остаются. Пик сравнивается с током отключения аппарата.
    Реле минимального напряжения ждёт выдержку и задержку выключателя.
    Падение частоты быстрее порога отключает. Запертый выключатель не двигается.
    Реле максимального напряжения ждёт задержку. Вставка и реле сравниваются
    по I²t. Уставка земли смотрит вторичный ток CT. Отказ выключателя
    запускает таймер резерва. АПВ ждёт бестоковую паузу. Разгрузка по
    напряжению сохраняет критическую нагрузку.     Инверсные кривые IEC
    пересекаются. Возврат после отключения ждёт непрерывное окно. Ближнее КЗ
    попадает в первую дистанционную зону, дальнее только во вторую. Медленный
    ход импеданса зону не отключает. Вторая гармоника выше 0.15 блокирует
    дифференциал. Карта луча покрывает место, источник, нагрузку и уставку.
    Полный период Фурье даёт фазор, короткое окно не готово. Это объявленный
    луч, не всякая площадка, и не сертифицированное реле.
  depends_on:
  - PM-03
  - PM-04
  gate: Селективность, CT/VT, времена отключений, отрицательные сценарии
  evidence_required:
  - versioned_case_and_parameters
  - replay_command
  - reference_and_scope
  - metrics_and_failures
  definition_of_done: Пройдены gates соответствующего раздела документа; результаты
    вычислены из evidence
- id: PM-06
  title: Многомашинная RMS динамика
  status: done
  progress: >-
    Две классические машины без возмущения остаются в равновесии. Ошибка угла
    падает примерно вчетверо при шаге вдвое. SMIB стартует из напряжения режима.
    Период малых качаний совпадает с линеаризованной частотой. После просадки
    напряжения новое равновесие снова на синхронной скорости, если момент
    ниже нового предела; иначе равновесия нет. Скачок Pm не разрывает угол,
    с демпфированием машина садится на новое равновесие.
    industrial_rms_qualified ложен. Washout по скорости совпадает с матричной
    экспонентой, в покое выход нулевой. Скачок реактивности связи не рвёт угол
    и садится на новое равновесие. Обрыв напряжения на выводах поднимает
    скорость на (ω/2H)Pm. Lead-lag на скачок совпадает с формулой. Предел
    мощности сажает уставку на pmax. Потолок возбуждения не даёт полю вырасти
    выше предела. Переменный ток машины идёт двумя экспонентами от I'' к I.
    Классическая машина ANDES 2 инициализируется из режима. Четыре машины
    Кундура с TGOV1, EXDC2 и IEEEST держат невязку ниже 1e-6. В покое скорость
    не уходит. Угол следует частоте вращения через отключение линии, генератора,
    разделение двух районов и шаг нагрузки. Мощность турбины и выход PSS
    совпадают со структурными схемами внутри 1e-6, турбина и PSS на скачок
    совпадают с передаточной функцией. Возбудитель сдвигается и остаётся в
    своём потолке. КЗ конечного сопротивления сажает напряжение и отпускает его.
    industrial_rms_qualified остаётся ложным: это схема Кундура, не произвольная
    сеть и не сертификат PSS/E.
  depends_on:
  - PM-00
  - PM-01
  - PM-02
  gate: DAE initialization, generators/controllers, reference trajectories
  evidence_required:
  - versioned_case_and_parameters
  - replay_command
  - reference_and_scope
  - metrics_and_failures
  definition_of_done: Пройдены gates соответствующего раздела документа; результаты
    вычислены из evidence
- id: PM-07
  title: Двигатели и преобразователи
  status: done
  progress: >-
    Одноконтурный двигатель за сопротивлением сети сходится к моменту
    нагрузки на устойчивой ветви и опрокидывается выше неё. Te = Pзазора/ω.
    Пуск идёт по приоритету и останавливается, если напряжение ниже порога.
    Остров только с grid-following инвертором не получает искусственный slack.
    Grid-forming — источник за явным R и X: напряжение совпадает с Тевенином,
    при превышении Sном без признака предела режим не меняется. С признаком
    forming_limit ЭДС снижается как корень из Sном/S, и мощность садится на
    номинал. В параллели с другим источником предел не применяется. Группа двигателей пускается
    по приоритету, пока напряжение фидера не падает ниже порога. Импеданс
    R/s+jX одного и двух двигателей совпадает с фазным расчётом внутри 1e-5 о.е.
    Напряжение того же КЗ опрокидывает момент, который до аварии удерживался.
    Заторможенный ротор при половинном напряжении берёт половину тока и
    четверть момента; фазный ток источника масштабируется так же. Реактивность,
    уменьшенная вместе с частотой, даёт ток по формуле. Это не ШИМ-преобразователь.
    Разгон скольжения от s=1 сходится к алгебраическому корню, ошибка шага
    падает примерно вчетверо, и за сопротивлением сети конец совпадает с
    равновесием. Выше опрокидывания скольжение растёт. Две клетки дают мощность
    ветвей внутри 1e-9 от параллели, при пуске момент выше одной клетки.
    Группа из двух двигателей разгоняется по очереди и совпадает с
    алгебраическим фидером внутри 1e-4, третий выше опрокидывания не
    подключается. Дрооп E=E0−kqQ совпадает с сетью внутри 1e-4. Окно U/f
    смотрит измеренную мощность. Короткий провал возвращает скольжение к
    равновесию, длинный уводит за неустойчивый корень. Круг накопителя с КПД
    возвращает SoC, рампа ограничивает шаг мощности. Холодный пуск следует
    экспоненте, volt-var ставит Q по кривой напряжения. Поверхностный эффект
    круглого провода совпадает у Кельвина и Бесселя. Шестиступенчатый спектр
    сходится к sqrt(π²/9−1). Приоритет P/Q режет круг мощности, volt-watt
    уменьшает запрос один раз. Разомкнутый ввод с grid-forming держит Тевенин,
    с grid-following гаснет. Ближняя отпайка задаёт напряжение НН. Два
    генератора делят мощность обратно статизму. Линейная рамка пуска даёт
    момент по квадрату напряжения. Реактор сажает напряжение. Полевая прямая
    режет Q раньше круга S. Одномерный паз: коэффициент сопротивления
    стремится к 1 при малом ξ и к ξ при большом. Первая гармоника двухполярной
    ШИМ равна m·Vdc/2. Пуск в темноте принимает только опору выше 0.9 о.е.
    Сетка паза сходится к аналитическому полю. Токовый контур привода
    первого порядка ограничен по току, момент ему пропорционален. Двумерное
    поле машины и программа заводского преобразователя за пределами модели.
  depends_on:
  - PM-06
  gate: Network-coupled start/stall/restart, current limits, island transitions
  evidence_required:
  - versioned_case_and_parameters
  - replay_command
  - reference_and_scope
  - metrics_and_failures
  definition_of_done: Пройдены gates соответствующего раздела документа; результаты
    вычислены из evidence
- id: PM-08
  title: Гармоники и качество
  status: done
  progress: >-
    Пустой спектр блокирует harmonic. Объявленный порядок снимает блокировку
    и не считается измерением. Формула RLC и отдельная узловая матрица совпадают.
    Удвоение ёмкости снижает резонанс в sqrt(2). Тройная гармоника даёт утроенный
    ток нейтрали. THD считается отдельно по первой гармонике и по RMS спектра.
    Типовой спектр завода и flicker не заявляются.
  depends_on:
  - PM-02
  gate: Спектры, резонансы, neutral currents и независимые frequency cases
  evidence_required:
  - versioned_case_and_parameters
  - replay_command
  - reference_and_scope
  - metrics_and_failures
  definition_of_done: Пройдены gates соответствующего раздела документа; результаты
    вычислены из evidence
- id: PM-09
  title: Оценка состояния и анализ
  status: done
  progress: >-
    Ненаблюдаемая WLS возвращает estimate None. Грубая ошибка — наибольший
    нормированный остаток выше 3, одно удаление возвращает оценку к истинному
    состоянию. Вторая грубая ошибка после одного удаления остаётся выше порога.
    Отключение одной из двух параллельных линий совпадает с делителем внутри
    1e-5 и не равно удвоению тока; N-1 помечает перегруз оставшейся линии.
    Локальный OPF двух узлов перепроверяется фазной сетью. Глобальный оптимум
    не заявлен. Две грубые ошибки удаляются по очереди и возвращают оценку.
    Ужатие vmax, qmax и pmax делает прежнюю точку недопустимой, тесный pmax
    не решается. Мощность опоры совпадает с фазной сетью внутри 1e-4.
    Пропуск одного измерения оставляет оценку, пропуск единственного канала
    второй переменной делает систему ненаблюдаемой. Угол ветви вне предела
    ловится аудитом. Два параллельных трансформатора совпадают с делителем
    внутри 1e-4 и не удваивают ток. Недоотпуск критической нагрузки равен её
    мощности, пока шина погашена. Ковариация оценки равна (Hᵀ W H)⁻¹.
    Отключение второго источника возвращает ток опоры к одноисточниковому
    балансу. Перегруз виден на приёмном конце ветви, когда отправляющий ещё
    внутри номинала.     Взвешенный остаток точных измерений равен нулю. Потери линии равны 3 I² R.
    Циркулянтная матрица возвращает Z1 и Z0. Отстающая нагрузка сажает
    напряжение сильнее опережающей. Конденсатор поднимает приёмную шину.
    Угол передачи совпадает с делителем. Одна фаза даёт полную несимметрию.
    Две параллельные линии: LODF равен 1. Передача без активного сопротивления
    равна |Vs||Vr|/X·sinδ. Начальный нагрев идёт с наклоном (T∞−T0)/τ.
    Двадцать четыре посеянных случая находят вставленную ошибку и не режут
    чистый набор. Это объявленный корпус, не статистика предприятия.
    Линейный DC OPF выпуклый, его оптимум глобальный. AC остаётся локальным.
  depends_on:
  - PM-02
  - PM-03
  gate: Наблюдаемость, bad data, N-1 и независимая feasibility OPF
  evidence_required:
