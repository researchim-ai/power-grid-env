  - id: AG-10
    title: Measured resource envelope and reliable long runs
    priority: P1_P2
    status: in_progress
    progress: >-
      Инкрементальная правка kW/kvar совпадает с холодным solve внутри 1e-5
      на двухшинной схеме. trace_limit ограничивает память журнала шагов.
      Луч 150 кВт и 0.05+j0.08 Ом на участок доводится подъёмом нагрузки
      до формулы на 2054 шинах внутри 1e-5 о.е. Дальше решения нет.
      10 000 шин с тем же суммарным Z, что у луча из 1000, сходятся.
      7 и 30 суток измерены на двухшинной схеме с шагом одни сутки.
      Два процесса решателя повторяют прямой расчёт, мёртвый процесс
      заменяется и не портит второй. Масштаб города не заявлен.
    depends_on: [AG-03, AG-05, AG-06, AG-07]
    scope: [power_grid_env/benchmarks.py, power_grid_env/backend_opendss.py, power_grid_env/backend_process.py, power_grid_env/dataset.py, benchmarks/external]
    findings: [IR-09]
    gates:
      - hardware_and_workload_budgets_frozen_before_evaluation
      - cold_warm_full_step_p50_p95_RSS_and_failures_measured
      - incremental_solver_preserves_trajectory_and_numerical_tolerances
      - bounded_buffers_streaming_results_no_unbounded_memory_growth
      - repeated_run_OOM_timeout_and_worker_recovery_tested
    trial_sizes_bus: [100, 1000, 10000]
    trial_horizons_days: [7, 30]
    size_claim_requires_actual_pass: true
