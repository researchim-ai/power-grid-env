  - id: AG-07
    title: Full external validation through production Engine
    priority: P1
    status: in_progress
    depends_on: [AG-01, AG-04, AG-05, AG-06]
    progress: >-
      Smoke и distribution сравнивают |V|, нейтраль (узел 4), потери,
      P/Q/I проводников при 1e-5 от Sbase и Ibase и отпайки. Несошедшийся
      Newton не оставляет состояние для Normal. Второй лист SMART-DS
      p1uhs0_1247--p1udt942 взят из уже скачанного дерева и проходит снимок;
      его QSTS не запускался, профили первого фидера не подставлялись.
      Короткое окно первого фидера SMART-DS идёт через Engine: раздельные
      множители P и Q, JSON-снимок после первого шага, |V| внутри 1e-5
      против прямого solve. Сутки и неделя двух фидеров через Engine не
      закрыты: у второго листа нет своих CSV.
    scope: [benchmarks/external, tests/test_external_benchmark.py, power_grid_env/checks.py]
    findings: [IR-06]
    gates:
      - V_I_P_Q_losses_neutral_controls_and_status_compared
      - production_Engine_used_for_QSTS_and_checkpoint
      - IEEE_13_34_123_and_three_ENWL_snapshots_qualified
      - two_different_SMART_DS_feeders_day_and_week_qualified
      - independent_solver_subset_and_precision_tiers_explicit
      - derived_native_reference_not_reported_as_original
      - ENWL_missing_Shape_N_not_fabricated
