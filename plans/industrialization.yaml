schema_version: power-grid-env.agent-workplan/v1
prepared_on: '2026-10-27'
baseline_commit: 336d6c830d049549cbf07cbe3b419a804e27c29b
status: in_progress
specification: docs/AGENT_INDUSTRIALIZATION_PLAN_RU.md
assessment: reports/industrial-readiness-20261027/assessment.json
target: Industrial QSTS v1
execution_policy:
  local_first: true
  economic_work: excluded
  status_done_requires_gate_evidence: true
  preserve_failed_cases: true
  forbid_threshold_changes_to_force_pass: true
  unavailable_external_data_blocks_only_dependent_track: true
  stop_after_planning: false
  core_files_changed_by_this_audit: false
release_profiles:
  industrial_qsts_v1:
    required_tasks: [AG-01, AG-02, AG-03, AG-04, AG-05, AG-06, AG-07, AG-08, AG-09, AG-10, AG-11, AG-16]
    optional_tasks: [AG-12, AG-13, AG-14]
    excluded: [full_EMT, HIL, real_time, live_equipment_control, cloud_cluster, economic_analysis]
    field_validation_required_for_software_release: false
    field_validation_claim_requires: AG-14
  industrial_rms:
    required_tasks: [AG-15]
    additional_prerequisite: qualified_industrial_qsts_contracts_and_runtime
    inherits_qsts_validation_automatically: false
task_result_contract:
  required_fields: [task_id, status, input_fingerprint, changed_files, commands, checks, evidence_paths, remaining_limits]
  statuses: [planned, in_progress, done, waiting_for_data, failed_gate]
  gate_pass_requires: all_required_checks_pass_and_evidence_present
  note: >-
    Это очередь реализации. Описания gates ниже ещё не являются выполняемыми
    тестами. Агент создаёт соответствующие tests/commands и фиксирует их
    реальные результаты, а не просто заменяет planned на done.
