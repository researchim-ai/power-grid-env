schema: power-grid-env.readiness/v1
date: '2026-10-31'
document: docs/INDUSTRIAL_READINESS_AND_ROADMAP_2026_10_30_RU.md
status: in_progress
released: false
competitive_superiority_proven: false
field_validation: waiting_for_data
items:
- id: IN-00
  title: Реестр доказательств и профиль
  status: done
  progress: >-
    PM-00…11 записаны как regression_verified и не открывают профиль.
    Пропуск, устаревший хеш, превышение допуска, неподдержанный объект и
    двухшинная схема не становятся успехом площадки. Неизвестный профиль
    не выпускается. Команда qualify --profile возвращает ненулевой код.
- id: IN-01
  title: StudySpec и общий запуск
  status: done
  progress: >-
    Один runner считает две разные сети power_flow/opendss. Двигатель,
    чужой backend и гармоническое исследование отклоняются до расчёта.
    Спектр без узла и фаз не принимается. Старое поле kind мигрирует в study.
    Канонический ANDES-адаптер и отдельный motor study добавлены последующими
    этапами; универсальный паспорт произвольной площадки ещё не квалифицирован.
- id: IN-02
  title: Пакет площадки
  status: done
  progress: >-
    Одна схема 110/10/0,4 кВ с двумя вводами, секцией, тремя трансформаторами,
    критической нагрузкой, ФЭС и накопителем. 23 сценария, из них нарушения
    ожидаются заранее. Место КЗ меняет ввод, нагрузка пересекает 0,95 о.е.,
    слепая уставка не видит ток. Динамический пуск двигателей и спектр без
    узла видны как отказ до расчёта. Профиль поставки и натурный трек не открыты.
- id: IN-03
  title: Внешний корпус
  status: done
  progress: >-
    Четырнадцать сетей пяти семейств. ENWL — отложенное семейство: успех IEEE
    его не закрывает. Один движок держит 1e-5 о.е. и 1e-4 рад, пара SimBench
    остаётся на 1e-4 о.е. без углов. Пропуск канала, исчезновение узла и
    перенос упрощений SimBench дают неуспех. Аналитическая двухшинная схема
    проходит 1e-5, 1e-4 и KCL 1e-8.
- id: IN-04
  status: in_progress
  progress: >-
    Нет своего CSV у любого из двух фидеров — расчёт суток блокируется и
    случайный профиль не подставляется. Внешние 2880 интервалов по 15 минут
    не считались. Добавлен общий QSTS runner с JSONL, checksum checkpoint,
    resume/cancel и ограниченным retained trace/history. На двух малых
    синтетических топологиях 30 суток по 2880 интервалов и повтор с середины
    прошли; это не квалификация двух внешних фидеров.
- id: IN-05
  title: КЗ площадки
  status: done
  progress: >-
    Формула одного источника на два ввода не применяется. Ток ввода меняется
    с местом КЗ. Более слабый источник и реактор в нейтрали уменьшают ток
    одноэквивалентной схемы. Ближняя уставка быстрее дальней, слепая уставка
    не видит повреждение, пик выше действующего, коэффициент отключения не
    больше единицы. Это не весь IEC 60909 и не заводской терминал.
- id: IN-06
  status: in_progress
  progress: >-
    Общий StudySpec rms/andes строит balanced GENCLS сеть из Network:
    положительная последовательность линий, PQ loads, внешний source Z,
    паспорта H/MVA/Xd-prime, события и полные траектории. Проверены
    аналитическая PF/RK45 сверка, h/h2/h4, смена системной базы, две машины,
    load scale, generator trip и connected line trip. Двухобмоточные transformers с tap/clock и разными voltage bases поддержаны
    и сверены с фазным backend. Трёхобмоточные, magnetization, LTC dynamics,
    GENROU с transient/subtransient rotor states и saturation добавлен и
    независимо сверён; GENSAL, совместная динамика motors+generators,
    converters и islanding ещё открыты.
    Добавлены TGOV1/SEXS/IEEEST, explicit balanced fault/clearing и killable
    process с deadline/cancel/output limits. Полная связанная declared SMIB
    сверена независимой ODE. Промышленный RMS профиль не открыт.
  document: docs/CANONICAL_RMS_RU.md
- id: IN-07
  status: in_progress
  progress: >-
    motor_start/scipy: single-cage third-order rotor dynamics with shared sparse
    balanced network, constant-Z background and two-winding transformers.
    Explicit fan torque, cold start, voltage sag/recovery, contactor coast/reclose
    and simultaneous/staggered group start. Independent physical SI rotor-flux
    reference and full T circuit; ABC snapshot checks four transformer groups.
    Controlled GENROU/motor dynamics, constant-torque loads, deep-bar, saturation, OEM rotor/stator thermal
    protection and converters remain open. Добавлена токовая тепловая реплика
    с непрерывным trip, latch/cooling и строгой сверкой SI CSV по протоколу.
  document: docs/INDUCTION_MOTOR_RU.md
- id: IN-08
  status: planned
- id: IN-09
  status: planned
- id: IN-10
  status: in_progress
  progress: >-
    Параллельный bounded solve_many, сериализация worker-протокола,
    ограниченные повторы независимого solve и восстановление worker.
    Wheel строится без сетевой build isolation и выполняет PF вне checkout
    с зависимостями текущего окружения. CI расширен на Python 3.11/3.12.
    Чистая установка всех зависимостей на другой машине, job API,
    дисковые квоты и OS sandbox недоверенного кода ещё не квалифицированы.
- id: IN-11
  status: waiting_for_data
- id: IN-12
  status: planned

