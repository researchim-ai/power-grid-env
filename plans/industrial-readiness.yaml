schema: power-grid-env.readiness/v1
date: '2026-11-01'
document: docs/NATIVE_SOURCE_TERMINAL_SENSING_RU.md
status: in_progress
released: false
competitive_superiority_proven: false
field_validation: waiting_for_data
items:
- id: IN-00
  title: Реестр доказательств и профиль
  status: done
  progress: PM-00…11 записаны как regression_verified и не открывают профиль. Пропуск, устаревший хеш, превышение
    допуска, неподдержанный объект и двухшинная схема не становятся успехом площадки. Неизвестный профиль не выпускается.
    Команда qualify --profile возвращает ненулевой код.
- id: IN-01
  title: StudySpec и общий запуск
  status: done
  progress: Общий StudySpec запускает power_flow/qsts, canonical RMS и small_signal, motor_start, coupled_rms и
    coupled_small_signal. Паспорта машин/моторов/регуляторов явные; неподдержанный scope/backend отклоняется до
    исполнения. Motor bundle добавляет переносимый snapshot и replay, без повышения qualification.
- id: IN-02
  title: Пакет площадки
  status: done
  progress: Одна схема 110/10/0,4 кВ с двумя вводами, секцией, тремя трансформаторами, критической нагрузкой, ФЭС
    и накопителем. 23 сценария, из них нарушения ожидаются заранее. Место КЗ меняет ввод, нагрузка пересекает 0,95
    о.е., слепая уставка не видит ток. Динамический пуск двигателей и спектр без узла видны как отказ до расчёта.
    Профиль поставки и натурный трек не открыты.
- id: IN-03
  title: Внешний корпус
  status: done
  progress: 'Четырнадцать сетей пяти семейств. ENWL — отложенное семейство: успех IEEE его не закрывает. Один движок
    держит 1e-5 о.е. и 1e-4 рад, пара SimBench остаётся на 1e-4 о.е. без углов. Пропуск канала, исчезновение узла
    и перенос упрощений SimBench дают неуспех. Аналитическая двухшинная схема проходит 1e-5, 1e-4 и KCL 1e-8.'
- id: IN-04
  status: in_progress
  progress: Нет своего CSV у любого из двух фидеров — расчёт суток блокируется и случайный профиль не подставляется.
    Внешние 2880 интервалов по 15 минут не считались. Добавлен общий QSTS runner с JSONL, checksum checkpoint, resume/cancel
    и ограниченным retained trace/history. На двух малых синтетических топологиях 30 суток по 2880 интервалов и
    повтор с середины прошли; это не квалификация двух внешних фидеров.
- id: IN-05
  title: КЗ площадки
  status: done
  progress: Формула одного источника на два ввода не применяется. Ток ввода меняется с местом КЗ. Более слабый источник
    и реактор в нейтрали уменьшают ток одноэквивалентной схемы. Ближняя уставка быстрее дальней, слепая уставка
    не видит повреждение, пик выше действующего, коэффициент отключения не больше единицы. Это не весь IEC 60909
    и не заводской терминал.
- id: IN-06
  status: in_progress
  progress: Network→ANDES GENCLS/GENROU, TGOV1/SEXS/IEEEST, finite balanced faults и two-winding tap/clock. Совместный
    SciPy GENCLS/GENROU/motor профиль имеет PSS, локальные моды, КЗ, связные line open/close и electrical generator_open
    с продолжающими движение ротором/регуляторами. Независимые SI/ANDES/ABC проверки относятся к объявленным subsets;
    GENSAL/converters/islanding, reclose/synchrocheck, внешний многомашинный корпус и промышленная квалификация
    открыты.
  document: docs/CANONICAL_RMS_RU.md
- id: IN-07
  status: in_progress
  progress: 'motor_start/scipy: single-cage and optional physical double-cage rotor/network dynamics, loaded equilibrium и mechanical load subsets,
    current-squared thermal replica, continuous trip/latch, строгая SI CSV-сверка и конечные параметрические эксперименты.
    Совместный controlled GENROU/motor subset добавлен отдельно. Motor bundle и чистая pinned wheel-установка закрывают
    часть воспроизводимости; continuous skin-effect/saturation/VFD, OEM thermal/reset/contactor и реальная приёмка не закрыты.'
  document: docs/INDUCTION_MOTOR_RU.md
- id: IN-08
  status: planned
- id: IN-09
  status: planned
- id: IN-10
  status: in_progress
  progress: Bounded worker и durable QSTS сохранены. Добавлены sealed motor bundle, проверка всех каналов/событий,
    frozen Linux x86_64 CPython 3.12 wheel hash-lock и две чистые offline venv на одном host с pip check и replay
    вне checkout. Импорт worker привязан к пакету родителя и private cwd. Другой host, целевая release-среда и независимый
    инженерный replay ещё не квалифицированы; hosted multi-tenant OS isolation не заявлена.
- id: IN-11
  status: waiting_for_data
  progress: "Пользователь не располагает паспортом/осциллограммами; агент ищет открытые данные. LIAS MCSA-DC скачан и проверен: три записи U/I/скорости, CC BY 4.0, pinned SHA256. Обнаружено противоречие единиц скорости и отсутствие подтверждённого пуска; натурная квалификация остаётся закрытой. Очередь источников и протокол: docs/PUBLIC_DOL_DATA_ACQUISITION_RU.md; отчёт reports/lias-motor-data-2026-10-31/eligibility.json."
- id: IN-12
  status: planned
