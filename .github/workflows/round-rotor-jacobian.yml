name: GENROU TGOV1 SEXS analytic Jacobian qualification
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'power_grid_env/**'
      - 'benchmarks/genrou_jacobian_validation.py'
      - 'benchmarks/coupled_jacobian_validation.py'
      - 'tests/test_genrou_jacobian.py'
      - 'requirements/pilot-linux-py312.lock'
      - 'requirements/solver-tests-linux-py312.lock'
      - '.github/workflows/round-rotor-jacobian.yml'
permissions:
  contents: read
env:
  OPENBLAS_NUM_THREADS: '1'
  OMP_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
jobs:
  genrou:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install --require-hashes -r requirements/pilot-linux-py312.lock -r requirements/solver-tests-linux-py312.lock
      - run: python -m pytest tests/test_genrou_jacobian.py -q --junitxml=/tmp/pge-genrou-tests.xml
      - run: python -m benchmarks.genrou_jacobian_validation --out /tmp/pge-genrou-qualified
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: genrou-jacobian-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            /tmp/pge-genrou-tests.xml
            /tmp/pge-genrou-qualified/
          if-no-files-found: error
          retention-days: 30
