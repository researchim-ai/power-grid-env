name: ci
on: [pull_request, workflow_dispatch]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install 'setuptools>=68' wheel
      - run: pip install -e ".[dev]"
      - run: pytest
      - run: python -m power_grid_env.cli validate
      - run: python -m power_grid_env.cli run-study cases/studies/qsts_runtime.json --out /tmp/pge-ci-qsts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: validation-python-${{ matrix.python }}
          path: |
            reports/validation/
            /tmp/pge-ci-qsts/result.json
