name: EX-04 frozen release candidate
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'power_grid_env/**'
      - 'benchmarks/**'
      - 'tests/**'
      - 'cases/**'
      - 'docs/**'
      - 'requirements/**'
      - 'examples/**'
      - 'plans/**'
      - 'pyproject.toml'
      - 'README*'
      - 'LICENSE'
      - '.github/workflows/release-candidate.yml'
permissions:
  contents: read
env:
  OPENBLAS_NUM_THREADS: '1'
  OMP_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  PGE_MOTULATOR_WHEEL: /tmp/pge-independent-wheels/motulator-0.19.0-py3-none-any.whl
  MPLCONFIGDIR: /tmp/pge-matplotlib
jobs:
  candidate:
    # One declared platform; this is not a cross-platform qualification claim.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Prepare hash-locked runtime and test environment
        run: |
          python -m pip install setuptools==79.0.1 wheel==0.45.1
          python -m pip install --require-hashes -r requirements/pilot-linux-py312.lock
          python -m pip install --require-hashes -r requirements/ex02-andes-linux-py312.lock
          python -m pip download --no-deps --only-binary=:all: --require-hashes -r requirements/motulator-reference.lock --dest /tmp/pge-independent-wheels
          python -m pip install --no-deps --require-hashes -r requirements/motulator-reference.lock
          python -m pip download --only-binary=:all: --require-hashes -r requirements/pilot-linux-py312.lock --dest /tmp/pge-release-wheels
      - name: Build twice and replay in two source-independent offline installations
        run: python -m benchmarks.pilot_installation --work /tmp/pge-release-work --out /tmp/pge-release-installation --wheelhouse /tmp/pge-release-wheels
      - name: Freeze source, wheels, notices, profile and negative-case inventory
        run: python -m benchmarks.release_candidate --installation /tmp/pge-release-installation --wheelhouse /tmp/pge-release-wheels --out /tmp/pge-release-candidate
      - name: Collect the entire suite and execute every required profile test
        run: python -m pytest tests -q -p benchmarks.release_inventory --release-profile requirements/release-balanced-dol-linux-py312.json --release-inventory /tmp/pge-release-evidence/test-inventory.json --junitxml=/tmp/pge-release-evidence/tests.xml
      - name: Bind source and complete test inventory to candidate identity
        run: |
          python -m benchmarks.release_receipt --candidate /tmp/pge-release-candidate --inventory /tmp/pge-release-evidence/test-inventory.json --source . --out /tmp/pge-release-evidence/execution.json
          python -I /tmp/pge-release-candidate/verify.py /tmp/pge-release-candidate
      - name: Assemble immutable attestation subject
        run: python -m benchmarks.release_archive --candidate /tmp/pge-release-candidate --evidence /tmp/pge-release-evidence --out /tmp/release-payload.zip
      - name: Sign release provenance on an explicit release run
        if: github.event_name == 'workflow_dispatch'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: /tmp/release-payload.zip
          create-storage-record: false
      - name: Publish signed release payload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ex04-linux-x86_64-py312-${{ github.sha }}-${{ github.run_attempt }}
          path: /tmp/release-payload.zip
          compression-level: 0
          if-no-files-found: error
          retention-days: 30
      - name: Retain failure diagnostics separately from a qualifying payload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: ex04-failed-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            /tmp/pge-release-evidence/
            /tmp/pge-release-installation/
          if-no-files-found: warn
          retention-days: 14
