      control_interval_s: 60
      settle_s: 600
      fault_line_id: damaged
      fault_kind: "3ph"
      fault_phases: ["A", "B", "C"]
      fault_r_ohm: 1.0
      fault_disclosed: true
      hidden_canary: "CANARY-invalid"
