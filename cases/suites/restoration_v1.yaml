  - id: disconnector_interlock
    model: cases/acceptance/knife
    timeout_s: 5
    baseline: {command: ["python3", "examples/controllers/noop_controller.py"]}
    candidate: {command: ["python3", "examples/controllers/knife_controller.py"]}
    scenario:
